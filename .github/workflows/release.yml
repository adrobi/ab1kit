name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" "pyinstaller==6.22.3"
      - name: Build exe (errors surfaced as annotations)
        shell: pwsh
        run: |
          python -m PyInstaller ab1kit.spec --noconfirm --workpath build-pyinstaller 2>&1 |
            Tee-Object -FilePath build_log.txt
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content build_log.txt -Tail 30) -join " | "
            Write-Host "::error::PyInstaller failed, log tail: $tail"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ab1kit-windows
          path: dist/ab1kit.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ab1kit.exe
          generate_release_notes: true
