[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ab1kit"
version = "0.1.0"
description = "Open-source desktop tool for viewing, editing and analyzing Sanger sequencing chromatograms (.ab1)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "biopython>=1.83",
    "PySide6>=6.6",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ab1kit = "chrom_cli:main"

[tool.setuptools]
packages = ["chrom_core", "ui"]
py-modules = ["chrom_cli", "i18n", "translations_en"]

[tool.pytest.ini_options]
testpaths = ["tests"]
